name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.2"
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      eov_source_sha: ${{ steps.meta.outputs.eov_source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate version, source metadata, and release uniqueness
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          python3 scripts/release.py validate-source --root . --version "$version"
          tag="v$version"
          source_sha="$GITHUB_SHA"

          tag_check_error="$RUNNER_TEMP/tag-check-error"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>"$tag_check_error"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "tag '$tag' already exists" >&2
            exit 1
          elif [[ "$tag_status" -ne 2 ]]; then
            cat "$tag_check_error" >&2
            exit 1
          fi

          release_check_error="$RUNNER_TEMP/release-check-error"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>"$release_check_error"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "GitHub Release '$tag' already exists" >&2
            exit 1
          elif ! grep -q '404' "$release_check_error"; then
            cat "$release_check_error" >&2
            exit 1
          fi

          eov_default_branch="$(gh api repos/eosin-platform/eov --jq .default_branch)"
          eov_source_sha="$(gh api "repos/eosin-platform/eov/commits/$eov_default_branch" --jq .sha)"
          {
            echo "source_sha=$source_sha"
            echo "eov_source_sha=$eov_source_sha"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-macos:
    name: macOS
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-windows:
    name: Windows
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  aggregate:
    name: Aggregate and validate artifacts
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage artifacts and generate release.toml
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          python3 scripts/release.py manifest \
            --root . \
            --plugin-name annotations \
            --version '${{ needs.prepare.outputs.version }}' \
            --repository eosin-platform/eov-annotations-plugin \
            --artifacts-dir artifacts \
            --staging-dir release-files \
            --output release-files/release.toml
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload validated release staging
        uses: actions/upload-artifact@v7
        with:
          name: annotations-release-staging-${{ github.run_id }}
          path: release-files
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, aggregate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Download validated release staging
        uses: actions/download-artifact@v8
        with:
          name: annotations-release-staging-${{ github.run_id }}
          path: release-files
          merge-multiple: true

      - name: Create draft release at SOURCE_SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create '${{ needs.prepare.outputs.tag }}' \
            --target '${{ needs.prepare.outputs.source_sha }}' \
            --title 'Annotations ${{ needs.prepare.outputs.version }}' \
            --generate-notes \
            --draft \
            release-files/*

      - name: Verify tag target and draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          source_sha='${{ needs.prepare.outputs.source_sha }}'
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          if [[ "$object_type" == "tag" ]]; then
            object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$object_sha" --jq .object.sha)"
          fi
          [[ "$object_sha" == "$source_sha" ]] || {
            echo "tag $tag points at $object_sha, expected $source_sha" >&2
            exit 1
          }
          expected="$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit '${{ needs.prepare.outputs.tag }}' --draft=false

      - name: Verify published asset URLs and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-assets \
            --root . \
            --plugin-name annotations \
            --version '${{ needs.prepare.outputs.version }}' \
            --repository eosin-platform/eov-annotations-plugin \
            --manifest release-files/release.toml
          curl --fail --location --silent --show-error \
            "https://github.com/eosin-platform/eov-annotations-plugin/releases/download/${{ needs.prepare.outputs.tag }}/release.toml" \
            | cmp - release-files/release.toml