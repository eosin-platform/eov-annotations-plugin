[package]
name = "annotations-ui-check"
version = "0.0.0"
edition = "2024"
publish = false
description = "Checks the annotations plugin's .slint surfaces against what the plugin pushes, with the Slint version eov uses, and renders them"

[dependencies]
annotations = { path = "../.." }
eov-plugin-api = { path = "../../../../plugin_api", version = "1.0" }
# The exact Slint version eov 1.0 compiles plugin surfaces with.
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["compat-1-2", "internal", "internal-json"] }
i-slint-compiler = { version = "=1.19.0", default-features = false }
# A window-less platform, to instantiate components and query their accessibility tree.
i-slint-backend-testing = { version = "=1.19.0", default-features = false }
serde_json = "1"
# For `ui-render`: draws the surfaces into PNG files to look at.
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
png = "0.18"

[[bin]]
name = "annotations-ui-check"
path = "src/main.rs"

[[bin]]
name = "ui-render"
path = "src/render.rs"

[workspace]
